databases:
  - name: techie-db
    databaseName: techie
    user: techie

services:
  - type: web
    name: techie-api
    runtime: docker
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: postgres
      - key: DB_URL
        fromDatabase:
          name: techie-db
          property: connectionString
      - key: DB_USERNAME
        fromDatabase:
          name: techie-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: techie-db
          property: password
      - key: CORS_ORIGIN
        value: https://techie-frontend.onrender.com
      - key: ADMIN_USERNAME
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

  - type: web
    name: techie-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        value: https://techie-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
